name: Deploy to Cloud Run

# Fork 分支约定（便于合并上游 Documenso 官方更新）：
# - main：生产发布 → contract-service-prod（与生产 WIF 的 main-only 条件一致）。
# - staging：合并/快进到待测的 main 后 push → contract-test（Cloud Run staging）。
# - release：保留给上游容器发布，不触发 FundConnectHK Cloud Run 部署。
on:
  push:
    branches:
      - main
      - staging

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REGION: europe-west1
  CLOUD_RUN_REGION: asia-east2
  GAR_REPOSITORY: services
  IMAGE_NAME: contract-service

jobs:
  # ─── 判断目标环境 ────────────────────────────────────────────────
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      cloud_run_service: ${{ steps.vars.outputs.cloud_run_service }}
    steps:
      - name: Determine deployment target
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENVIRONMENT="production"
            SERVICE="contract-service-prod"
          else
            ENVIRONMENT="staging"
            SERVICE="contract-service-staging"
          fi

          IMAGE="${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "ERROR: GCP_PROJECT_ID is empty in setup job"
            exit 1
          fi

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "cloud_run_service=${SERVICE}" >> "$GITHUB_OUTPUT"

          echo "resolved ref=${GITHUB_REF_NAME}"
          echo "resolved env=${ENVIRONMENT}"
          echo "resolved image prefix=${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:"

  # ─── 构建并推送镜像到 Artifact Registry ─────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: setup
    # Bind the job to the resolved GitHub environment so its OIDC token carries
    # the production/staging environment claim required by GCP WIF.
    environment:
      name: ${{ needs.setup.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          ENV_TAG="${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.environment }}-latest"

          if [ -z "${IMAGE:-}" ]; then
            echo "ERROR: IMAGE is empty in build-and-push job"
            exit 1
          fi

          echo "Using IMAGE=$IMAGE"
          echo "Using ENV_TAG=$ENV_TAG"

          docker build \
            -f ./docker/Dockerfile \
            --progress=plain \
            -t "$IMAGE" \
            -t "$ENV_TAG" \
            .

          docker push "$IMAGE"
          docker push "$ENV_TAG"

  # ─── 部署到 Staging（staging 分支 → contract-test）──────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    if: needs.setup.outputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 非敏感配置来自 GitHub Environment；敏感配置直接引用 GCP Secret Manager。
      - name: Deploy to Cloud Run (Staging)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: contract-service-staging
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --add-cloudsql-instances=fundconnecthk-489906:asia-east2:fundconnecthk-contracts-db-staging-hk
            --vpc-connector=redis-connector-staging
            --service-account=contract-staging-runtime@fundconnecthk-489906.iam.gserviceaccount.com
            --cpu=2
            --memory=4Gi
            --vpc-egress=private-ranges-only
          env_vars: |
            NEXT_PUBLIC_WEBAPP_URL=${{ secrets.NEXT_PUBLIC_WEBAPP_URL }}
            NEXT_PRIVATE_INTERNAL_WEBAPP_URL=${{ secrets.NEXT_PRIVATE_INTERNAL_WEBAPP_URL }}
            NEXT_PRIVATE_JOBS_PROVIDER=${{ vars.NEXT_PRIVATE_JOBS_PROVIDER || secrets.NEXT_PRIVATE_JOBS_PROVIDER }}
            NEXT_PRIVATE_BULLMQ_CONCURRENCY=${{ vars.NEXT_PRIVATE_BULLMQ_CONCURRENCY || secrets.NEXT_PRIVATE_BULLMQ_CONCURRENCY }}
            NEXT_PRIVATE_SMTP_TRANSPORT=${{ secrets.NEXT_PRIVATE_SMTP_TRANSPORT }}
            NEXT_PRIVATE_SMTP_HOST=${{ secrets.NEXT_PRIVATE_SMTP_HOST }}
            NEXT_PRIVATE_SMTP_PORT=${{ secrets.NEXT_PRIVATE_SMTP_PORT }}
            NEXT_PRIVATE_SMTP_USERNAME=${{ secrets.NEXT_PRIVATE_SMTP_USERNAME }}
            NEXT_PRIVATE_SMTP_FROM_NAME=${{ secrets.NEXT_PRIVATE_SMTP_FROM_NAME }}
            NEXT_PRIVATE_SMTP_FROM_ADDRESS=${{ secrets.NEXT_PRIVATE_SMTP_FROM_ADDRESS }}
            NEXT_PUBLIC_UPLOAD_TRANSPORT=${{ secrets.NEXT_PUBLIC_UPLOAD_TRANSPORT }}
            NEXT_PRIVATE_UPLOAD_ENDPOINT=${{ secrets.NEXT_PRIVATE_UPLOAD_ENDPOINT }}
            NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE=${{ secrets.NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE }}
            NEXT_PRIVATE_UPLOAD_REGION=${{ secrets.NEXT_PRIVATE_UPLOAD_REGION }}
            NEXT_PRIVATE_UPLOAD_BUCKET=${{ secrets.NEXT_PRIVATE_UPLOAD_BUCKET }}
            NEXT_PRIVATE_SIGNING_TRANSPORT=local
          secrets: |
            NEXT_PRIVATE_DATABASE_URL=contract-staging-database-url:latest
            NEXT_PRIVATE_DIRECT_DATABASE_URL=contract-staging-direct-database-url:latest
            NEXT_PRIVATE_REDIS_URL=contract-staging-redis-url:latest
            NEXTAUTH_SECRET=contract-staging-nextauth-secret:latest
            NEXT_PRIVATE_ENCRYPTION_KEY=contract-staging-encryption-key:latest
            NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=contract-staging-encryption-secondary-key:latest
            NEXT_PRIVATE_SMTP_PASSWORD=contract-staging-smtp-password:latest
            NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID=contract-staging-upload-access-key-id:latest
            NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY=contract-staging-upload-secret-access-key:latest
            NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS=contract-staging-signing-local-file-contents:latest

      - name: Route Staging traffic to latest revision
        run: >-
          gcloud run services update-traffic contract-service-staging
          --project="${{ env.GCP_PROJECT_ID }}"
          --region="${{ env.CLOUD_RUN_REGION }}"
          --to-latest
          --quiet

      - name: Show Staging URL
        run: echo "Staging deployed to ${{ steps.deploy.outputs.url }}"

  # ─── 部署到 Production（main 分支）──────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    if: needs.setup.outputs.environment == 'production'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: contract-service-prod
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --add-cloudsql-instances=fundconnecthk-489906:asia-east2:fundconnecthk-contracts-db-prod-hk
            --vpc-connector=contract-prod-conn
            --service-account=contract-prod-runtime@fundconnecthk-489906.iam.gserviceaccount.com
            --cpu=1
            --memory=2Gi
            --vpc-egress=private-ranges-only
            --ingress=internal-and-cloud-load-balancing
          env_vars: |
            NEXT_PUBLIC_WEBAPP_URL=${{ secrets.NEXT_PUBLIC_WEBAPP_URL }}
            NEXT_PRIVATE_INTERNAL_WEBAPP_URL=${{ secrets.NEXT_PRIVATE_INTERNAL_WEBAPP_URL }}
            NEXT_PRIVATE_JOBS_PROVIDER=${{ vars.NEXT_PRIVATE_JOBS_PROVIDER || secrets.NEXT_PRIVATE_JOBS_PROVIDER }}
            NEXT_PRIVATE_BULLMQ_CONCURRENCY=${{ vars.NEXT_PRIVATE_BULLMQ_CONCURRENCY || secrets.NEXT_PRIVATE_BULLMQ_CONCURRENCY }}
            NEXT_PRIVATE_SMTP_TRANSPORT=${{ secrets.NEXT_PRIVATE_SMTP_TRANSPORT }}
            NEXT_PRIVATE_SMTP_HOST=${{ secrets.NEXT_PRIVATE_SMTP_HOST }}
            NEXT_PRIVATE_SMTP_PORT=${{ secrets.NEXT_PRIVATE_SMTP_PORT }}
            NEXT_PRIVATE_SMTP_USERNAME=${{ secrets.NEXT_PRIVATE_SMTP_USERNAME }}
            NEXT_PRIVATE_SMTP_FROM_NAME=${{ secrets.NEXT_PRIVATE_SMTP_FROM_NAME }}
            NEXT_PRIVATE_SMTP_FROM_ADDRESS=${{ secrets.NEXT_PRIVATE_SMTP_FROM_ADDRESS }}
            NEXT_PUBLIC_UPLOAD_TRANSPORT=${{ secrets.NEXT_PUBLIC_UPLOAD_TRANSPORT }}
            NEXT_PRIVATE_UPLOAD_ENDPOINT=${{ secrets.NEXT_PRIVATE_UPLOAD_ENDPOINT }}
            NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE=${{ secrets.NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE }}
            NEXT_PRIVATE_UPLOAD_REGION=${{ secrets.NEXT_PRIVATE_UPLOAD_REGION }}
            NEXT_PRIVATE_UPLOAD_BUCKET=${{ secrets.NEXT_PRIVATE_UPLOAD_BUCKET }}
            NEXT_PRIVATE_SIGNING_TRANSPORT=local
          secrets: |
            NEXT_PRIVATE_DATABASE_URL=contract-prod-database-url:latest
            NEXT_PRIVATE_DIRECT_DATABASE_URL=contract-prod-direct-database-url:latest
            NEXT_PRIVATE_REDIS_URL=contract-prod-redis-url:latest
            NEXTAUTH_SECRET=contract-prod-nextauth-secret:latest
            NEXT_PRIVATE_ENCRYPTION_KEY=contract-prod-encryption-key:latest
            NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=contract-prod-encryption-secondary-key:latest
            NEXT_PRIVATE_SMTP_PASSWORD=contract-prod-smtp-password:latest
            NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID=contract-prod-upload-access-key-id:latest
            NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY=contract-prod-upload-secret-access-key:latest
            NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS=contract-prod-signing-local-file-contents:latest

      - name: Route Production traffic to latest revision
        run: >-
          gcloud run services update-traffic contract-service-prod
          --project="${{ env.GCP_PROJECT_ID }}"
          --region="${{ env.CLOUD_RUN_REGION }}"
          --to-latest
          --quiet

      - name: Show Production URL
        run: echo "Production deployed to ${{ steps.deploy.outputs.url }}"
